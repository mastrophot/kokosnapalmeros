name: Sync Instagram Photos

on:
  schedule:
    - cron: '0 4 * * *'  # Щодня о 04:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-instagram-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Download Instagram photos
        env:
          IG_SESSION: ${{ secrets.IG_SESSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'kokosnapalmeros' }}
        run: python3 sync-instagram.py --limit 50

      - name: Update gallery HTML and bundle
        run: node update-gallery.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add images/ thumbs/ gallery-data.json gallery-items.js index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-sync: Update gallery from Instagram"
            git pull --rebase origin main
            git push
          fi
